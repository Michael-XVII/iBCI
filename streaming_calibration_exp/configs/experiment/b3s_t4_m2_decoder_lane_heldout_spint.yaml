# @package _global_

defaults:
  - override /model: streaming_b3s_t4
  - override /data: falcon_m2

run_id: decoder_lane_t4_m2_heldout_spint
tags: ["native-mua", "t4", "m2", "decoder-lane", "heldout-selected", "spint-style"]
comparison_role: t4
optimized_metric: val_heldout/r2_mean
require_baseline_validation: false
no_early_stopping: false
ckpt_path: null

model:
  freeze_decoder: true

data:
  validation_protocol: minival
  loso_fold: null
  include_heldout_in_fit: true
  include_heldout_in_test: true
  side_feature_group: t4
  random_calibration: false

trainer:
  max_epochs: 12

callbacks:
  early_stopping:
    monitor: val_heldout/r2_mean
    patience: 5
    mode: max
  best_checkpoint:
    monitor: val_heldout/r2_mean
    mode: max
  periodic_checkpoint:
    monitor: val_heldout/r2_mean
    mode: max
